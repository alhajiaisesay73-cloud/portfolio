<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Traffic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand-navy:#0D1B2A; --brand-blue:#1E6FD9; --brand-gray-text:#4A5568;
  --brand-body-text:#1A202C; --brand-bg:#FFFFFF; --brand-fill:#F7F9FC;
  --brand-border:#E2E8F0;
  --brand-font:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--brand-font);color:var(--brand-body-text);background:var(--brand-fill);font-size:14px}
header{background:var(--brand-navy);border-bottom:3px solid var(--brand-blue);padding:22px 32px}
.mark{font-weight:700;letter-spacing:3.5px;color:#fff;font-size:15px}
.mark span{display:block;font-weight:400;letter-spacing:0;color:var(--brand-blue);font-size:12px;margin-top:3px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 32px 64px}
h2{font-size:17px;font-weight:600;margin:34px 0 14px;padding-left:11px;border-left:3px solid var(--brand-blue)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-top:4px}
.tile{background:var(--brand-bg);border:1px solid var(--brand-border);border-radius:3px;padding:18px 20px}
.tile b{display:block;font-size:30px;font-weight:700;color:var(--brand-navy);line-height:1.1}
.tile small{display:block;margin-top:6px;color:var(--brand-gray-text);font-size:11px;letter-spacing:.3px}
.panel{background:var(--brand-bg);border:1px solid var(--brand-border);border-radius:3px;padding:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--brand-navy);color:#fff;font-weight:700;font-size:11px;text-align:left;padding:9px 12px;letter-spacing:.4px}
td{padding:9px 12px;border-bottom:1px solid var(--brand-border)}
tbody tr:nth-child(even){background:var(--brand-fill)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--brand-blue);border-radius:1px;display:inline-block;vertical-align:middle}
.controls{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
button{font-family:var(--brand-font);font-size:12px;font-weight:600;padding:7px 15px;border:1px solid var(--brand-border);background:var(--brand-bg);color:var(--brand-gray-text);border-radius:3px;cursor:pointer}
button.on{background:var(--brand-blue);border-color:var(--brand-blue);color:#fff}
.note{color:var(--brand-gray-text);font-size:11px;margin-top:10px;line-height:1.6}
.empty{color:var(--brand-gray-text);padding:14px 0;font-size:13px}
input[type=password]{font-family:var(--brand-font);font-size:13px;padding:9px 12px;border:1px solid var(--brand-border);border-radius:3px;width:320px;max-width:100%}
footer{border-top:1px solid var(--brand-border);margin-top:44px;padding-top:14px;color:var(--brand-gray-text);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<header>
  <div class="mark">ALHAJI SESAY<span>AI Automation Consultant</span></div>
</header>
<div class="wrap" id="root">
  <p class="empty">Loading&hellip;</p>
</div>

<script>
const ENDPOINT = "https://gnbrmuxxtocqmxcrxixz.supabase.co/functions/v1/portfolio-stats";
const root = document.getElementById("root");
let days = 30;

/* The key rides in the hash rather than the query string, so it is never sent
   to a server or written into any access log. First load stores it locally,
   which is why the bookmark can afterwards be the bare URL. */
function getKey() {
  const m = location.hash.match(/key=([a-f0-9]+)/i);
  if (m) {
    try { localStorage.setItem("pf_key", m[1]); } catch (e) {}
    history.replaceState(null, "", location.pathname);
    return m[1];
  }
  try { return localStorage.getItem("pf_key"); } catch (e) { return null; }
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDur = s => s == null ? "—" : s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";

function askForKey(msg) {
  root.innerHTML =
    '<h2>Access key</h2>' +
    '<div class="panel">' +
      (msg ? '<p class="empty">' + esc(msg) + '</p>' : '') +
      '<p class="note" style="margin-top:0">Paste the stats key. It is stored in this browser only.</p>' +
      '<div class="controls">' +
        '<input type="password" id="k" placeholder="key" autocomplete="off">' +
        '<button class="on" id="go">Open</button>' +
      '</div>' +
    '</div>';
  const submit = () => {
    const v = document.getElementById("k").value.trim();
    if (!v) return;
    try { localStorage.setItem("pf_key", v); } catch (e) {}
    load();
  };
  document.getElementById("go").onclick = submit;
  document.getElementById("k").onkeydown = e => { if (e.key === "Enter") submit(); };
}

function rankTable(title, rows, labelKey) {
  if (!rows.length) {
    return '<div class="panel"><h2 style="margin-top:0">' + title + '</h2><p class="empty">Nothing yet.</p></div>';
  }
  const max = Math.max.apply(null, rows.map(r => r.views));
  const body = rows.map(r =>
    '<tr><td>' + esc(r[labelKey]) + '</td>' +
    '<td style="width:45%"><span class="bar" style="width:' + Math.max(3, (r.views / max) * 100) + '%"></span></td>' +
    '<td class="n">' + r.views + '</td></tr>'
  ).join("");
  return '<div class="panel"><h2 style="margin-top:0">' + title + '</h2><table><tbody>' + body + '</tbody></table></div>';
}

function chart(daily) {
  const max = Math.max.apply(null, [1].concat(daily.map(d => d.views)));
  const W = 1000, H = 150, n = daily.length, bw = W / n;
  const bars = daily.map((d, i) => {
    const h = (d.views / max) * (H - 24);
    return '<rect x="' + (i * bw + bw * 0.18) + '" y="' + (H - h - 18) + '" width="' + (bw * 0.64) +
      '" height="' + Math.max(h, d.views ? 2 : 0) + '" fill="#1E6FD9" rx="1">' +
      '<title>' + d.day + ': ' + d.views + ' views</title></rect>';
  }).join("");
  const step = Math.ceil(n / 8);
  const ticks = daily.map((d, i) =>
    (i % step === 0 || i === n - 1)
      ? '<text x="' + (i * bw + bw / 2) + '" y="' + (H - 4) + '" font-size="10" fill="#4A5568" ' +
        'text-anchor="middle" font-family="Montserrat, sans-serif">' + d.day.slice(5) + '</text>'
      : ""
  ).join("");
  return '<div class="panel"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="170" ' +
    'role="img" aria-label="Daily views">' + bars + ticks + '</svg></div>';
}

function render(s) {
  const pct = s.views_total ? Math.round((s.engaged_views / s.views_total) * 100) : 0;
  const dayBtns = [7, 30, 90].map(d =>
    '<button data-d="' + d + '" class="' + (d === days ? "on" : "") + '">' + d + ' days</button>').join("");

  const recent = s.recent.length
    ? '<table><thead><tr><th>When</th><th>Source</th><th>Location</th><th>Device</th>' +
      '<th style="text-align:right">Stayed</th></tr></thead><tbody>' +
      s.recent.map(r =>
        '<tr><td>' + new Date(r.created_at).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) + '</td>' +
        '<td>' + esc(r.source) + '</td>' +
        '<td>' + esc([r.city, r.country].filter(Boolean).join(", ") || "Unknown") + '</td>' +
        '<td>' + esc(r.device) + '</td>' +
        '<td class="n">' + fmtDur(r.duration_s) + '</td></tr>').join("") +
      '</tbody></table>'
    : '<p class="empty" style="padding:18px">No visits recorded yet.</p>';

  root.innerHTML =
    '<h2>Portfolio traffic</h2>' +
    '<div class="controls">' + dayBtns + '<button id="refresh">Refresh</button></div>' +

    '<div class="tiles" style="margin-top:16px">' +
      '<div class="tile"><b>' + s.views_total + '</b><small>VIEWS, ALL TIME</small></div>' +
      '<div class="tile"><b>' + s.visitors_total + '</b><small>UNIQUE VISITORS</small></div>' +
      '<div class="tile"><b>' + s.views_7d + '</b><small>VIEWS, LAST 7 DAYS</small></div>' +
      '<div class="tile"><b>' + s.views_today + '</b><small>VIEWS TODAY</small></div>' +
      '<div class="tile"><b>' + fmtDur(s.avg_seconds) + '</b><small>AVERAGE TIME ON PAGE</small></div>' +
      '<div class="tile"><b>' + pct + '%</b><small>STAYED 30s OR MORE</small></div>' +
    '</div>' +

    '<h2>Views per day, last ' + s.days + ' days</h2>' + chart(s.daily) +

    '<h2>Where they came from</h2>' +
    '<div class="cols">' +
      rankTable("Source", s.sources, "source") +
      rankTable("Location", s.countries, "country") +
      rankTable("Device", s.devices, "device") +
    '</div>' +

    '<h2>Recent visits</h2>' +
    '<div class="panel" style="padding:0;overflow:hidden">' + recent + '</div>' +

    '<p class="note">Counts exclude known bots and crawlers. A view is counted once per page load. ' +
    'Time on page is measured when the tab is closed or hidden, so a visitor who leaves the tab open ' +
    'shows no duration. Your own devices are excluded on any device where you have opened the ' +
    'portfolio with <code>?owner=1</code>.</p>' +

    '<footer><span>Alhaji Sesay | AI Automation Consultant</span>' +
    '<span>Updated ' + new Date(s.generated_at).toLocaleString() + '</span></footer>';

  Array.prototype.forEach.call(root.querySelectorAll("button[data-d]"), b => {
    b.onclick = () => { days = +b.dataset.d; load(); };
  });
  document.getElementById("refresh").onclick = load;
}

async function load() {
  const key = getKey();
  if (!key) return askForKey("");
  root.innerHTML = '<p class="empty">Loading&hellip;</p>';
  try {
    const r = await fetch(ENDPOINT + "?key=" + encodeURIComponent(key) + "&days=" + days);
    if (r.status === 401) {
      try { localStorage.removeItem("pf_key"); } catch (e) {}
      return askForKey("That key was not accepted.");
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    render(await r.json());
  } catch (e) {
    root.innerHTML = '<div class="panel"><p class="empty">Could not load stats: ' + esc(e.message) + '</p></div>';
  }
}

load();
</script>
</body>
</html>
